<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLM-OCR 票据 / 停车识别</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>GLM-OCR 识别</h1>
    <span id="backend-badge" class="badge">后端：…</span>
  </header>

  <main>
    <!-- 功能选择 -->
    <section class="card">
      <div class="row">
        <label class="seg">
          <input type="radio" name="task" value="parking" checked>
          <span>停车信息（时间 / 时长 / 单价 / 车架号 / 金额）</span>
        </label>
        <label class="seg">
          <input type="radio" name="task" value="invoice">
          <span>发票 / 支付凭证（实付金额）</span>
        </label>
      </div>
      <p id="task-hint" class="hint"></p>
    </section>

    <!-- 输入方式 -->
    <section class="card">
      <div class="tabs">
        <button class="tab active" data-mode="excel">① 上传 Excel</button>
        <button class="tab" data-mode="images">② 上传图片</button>
        <button class="tab" data-mode="urls">③ 图片直链 URL</button>
      </div>

      <div class="pane" data-pane="excel">
        <input type="file" id="excel" accept=".xlsx,.xls">
        <p class="hint" id="excel-hint"></p>
      </div>
      <div class="pane hidden" data-pane="images">
        <input type="file" id="imgs" accept="image/*" multiple>
        <p class="hint" id="images-hint"></p>
      </div>
      <div class="pane hidden" data-pane="urls">
        <textarea id="urls" rows="6" placeholder="每行一个图片直链 URL（支持 ptmapi 代理链，自动转 OBS 直链）"></textarea>
      </div>

      <div class="row actions">
        <button id="run" class="primary">开始识别</button>
        <button id="stop" class="danger hidden">停止识别</button>
        <span id="status" class="status"></span>
      </div>
      <div id="progress-wrap" class="progress-wrap hidden">
        <div class="progress-track">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <span id="progress-text" class="progress-text"></span>
        <span id="progress-time" class="progress-time"></span>
      </div>
    </section>

    <!-- 结果概览 -->
    <section id="summary-section" class="card hidden">
      <div id="summary-bar" class="summary-bar"></div>
    </section>

    <!-- 异常面板：金额不匹配 -->
    <section id="amount-mismatch-section" class="card anomaly-card hidden">
      <div class="anomaly-header anomaly-header--mismatch">
        <span class="anomaly-icon">&#9888;</span>
        <h3>金额不匹配</h3>
        <span id="amount-mismatch-count" class="anomaly-count"></span>
        <button id="export-amount-mismatch" class="export-btn export-btn--anomaly">导出 Excel</button>
        <button class="anomaly-toggle" data-target="amount-mismatch-body">收起</button>
      </div>
      <div id="amount-mismatch-body" class="anomaly-body">
        <div class="table-wrap">
          <table id="amount-mismatch-table"><thead></thead><tbody></tbody></table>
        </div>
      </div>
    </section>

    <!-- 异常面板：车架号不匹配 -->
    <section id="vin-mismatch-section" class="card anomaly-card hidden">
      <div class="anomaly-header anomaly-header--vin">
        <span class="anomaly-icon">&#9888;</span>
        <h3>车架号不匹配</h3>
        <span id="vin-mismatch-count" class="anomaly-count"></span>
        <button id="export-vin-mismatch" class="export-btn export-btn--anomaly">导出 Excel</button>
        <button class="anomaly-toggle" data-target="vin-mismatch-body">收起</button>
      </div>
      <div id="vin-mismatch-body" class="anomaly-body">
        <div class="table-wrap">
          <table id="vin-mismatch-table"><thead></thead><tbody></tbody></table>
        </div>
      </div>
    </section>

    <!-- 异常面板：停车费异常 -->
    <section id="parking-anomaly-section" class="card anomaly-card hidden">
      <div class="anomaly-header anomaly-header--parking">
        <span class="anomaly-icon">&#9881;</span>
        <h3>停车费异常</h3>
        <span id="parking-anomaly-count" class="anomaly-count"></span>
        <button id="export-parking-anomaly" class="export-btn export-btn--anomaly">导出 Excel</button>
        <button class="anomaly-toggle" data-target="parking-anomaly-body">收起</button>
      </div>
      <p class="anomaly-desc">单价 &gt; 25 元/小时 或 &lt; 0.1 元/小时 或未识别到停车费的记录</p>
      <div id="parking-anomaly-body" class="anomaly-body">
        <div class="table-wrap">
          <table id="parking-anomaly-table"><thead></thead><tbody></tbody></table>
        </div>
      </div>
    </section>

    <!-- 主结果表 -->
    <section class="card">
      <div id="banner" class="banner hidden"></div>
      <div class="table-header-row">
        <h3 class="table-title">全部识别结果</h3>
        <button id="export-main" class="export-btn" disabled>导出 Excel</button>
      </div>
      <div class="table-wrap">
        <table id="result-table"><thead></thead><tbody></tbody></table>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
